<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Order of tool calls">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#004EEB"/></marker></defs>
<rect width="760" height="290" fill="#ffffff"/>
<text x="10" y="20" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#171717">1. Find</text>
<text x="270" y="20" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#171717">2. Profile</text>
<text x="530" y="20" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#171717">3. Go deeper</text>
<rect x="10" y="64" width="220" height="44" rx="4" fill="#EFF4FF" stroke="#d4d4d4"/><text x="22" y="83" font-family="'Monaspace Neon', ui-monospace, Menlo, monospace" font-size="12.5" fill="#171717">match_entity</text><text x="22" y="99" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">Screen a party. Scored candidates.</text>
<rect x="10" y="120" width="220" height="44" rx="4" fill="#EFF4FF" stroke="#d4d4d4"/><text x="22" y="139" font-family="'Monaspace Neon', ui-monospace, Menlo, monospace" font-size="12.5" fill="#171717">search_entities</text><text x="22" y="155" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">Search by keyword. No score.</text>
<rect x="270" y="92" width="220" height="44" rx="4" fill="#EFF4FF" stroke="#d4d4d4"/><text x="282" y="111" font-family="'Monaspace Neon', ui-monospace, Menlo, monospace" font-size="12.5" fill="#171717">fetch_entity_by_id</text><text x="282" y="127" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">One entity and its relationships.</text>
<rect x="530" y="36" width="220" height="44" rx="4" fill="#EFF4FF" stroke="#d4d4d4"/><text x="542" y="55" font-family="'Monaspace Neon', ui-monospace, Menlo, monospace" font-size="12.5" fill="#171717">fetch_entity_descriptions</text><text x="542" y="71" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">Why the entity is listed.</text>
<rect x="530" y="92" width="220" height="44" rx="4" fill="#EFF4FF" stroke="#d4d4d4"/><text x="542" y="111" font-family="'Monaspace Neon', ui-monospace, Menlo, monospace" font-size="12.5" fill="#171717">fetch_entity_relations</text><text x="542" y="127" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">All relationships of one type.</text>
<rect x="530" y="148" width="220" height="44" rx="4" fill="#EFF4FF" stroke="#d4d4d4"/><text x="542" y="167" font-family="'Monaspace Neon', ui-monospace, Menlo, monospace" font-size="12.5" fill="#171717">fetch_entity_statements</text><text x="542" y="183" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">The source of each value.</text>
<line x1="236" y1="114" x2="260" y2="114" stroke="#004EEB" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="496" y1="114" x2="520" y2="114" stroke="#004EEB" stroke-width="1.5" marker-end="url(#a)"/>
<text x="10" y="216" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">Returns entities at level 1</text>
<text x="270" y="216" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">Returns one entity at level 2</text>
<text x="530" y="216" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">Returns text, relationships, statements</text>
<rect x="10" y="236" width="740" height="44" rx="4" fill="#ffffff" stroke="#d4d4d4" stroke-dasharray="4 3"/>
<text x="22" y="263" font-family="'Monaspace Neon', ui-monospace, Menlo, monospace" font-size="12.5" fill="#171717">describe</text>
<text x="100" y="263" font-family="'Mona Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#525252">Any step: schema and property names, topic and country codes, dataset and program records.</text>
</svg>
